services:
  mysql:
    image: mysql:9.7.2
    container_name: ffm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: devrootpass
      MYSQL_DATABASE: firefly_manager
      MYSQL_USER: ffm
      MYSQL_PASSWORD: devffmpass
    ports:
      - "3306:3306"
    volumes:
      - ffm-mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdevrootpass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ffm-net

  adminer:
    image: adminer:5.5.1
    container_name: ffm-adminer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    networks:
      - ffm-net

volumes:
  ffm-mysql-data:

networks:
  ffm-net:
    name: ffm-net
