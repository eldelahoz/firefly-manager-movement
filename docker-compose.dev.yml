services:
  mysql:
    image: mysql:9.7.2
    container_name: ffm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: devrootpass
      MYSQL_DATABASE: firefly_manager
      MYSQL_USER: ffm
      MYSQL_PASSWORD: devffmpass
    ports:
      - "3306:3306"
    volumes:
      - ffm-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:5.5.1
    container_name: ffm-adminer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql

volumes:
  ffm-mysql-data:
