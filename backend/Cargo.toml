[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/presentation",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.75"

[workspace.dependencies]
# Async / HTTP
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }
# OpenAPI + Scalar
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.2"
utoipa-scalar = "0.3"
# Serialización
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Observabilidad
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Config
dotenvy = "0.15"
# Fechas (domain)
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# Errores y traits async (application)
thiserror = "2"
async-trait = "0.1"
# ORM MySQL (infrastructure)
diesel = { version = "2", default-features = false, features = ["mysql", "chrono", "serde_json"] }
diesel-async = { version = "0.9", features = ["mysql", "deadpool", "migrations"] }
diesel_migrations = "2"
# HTTP client (infrastructure)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# CSV decoding (infrastructure)
encoding_rs = "0.8"
# CSV parsing (application)
csv = "1.3"
# File hashing (application)
sha2 = "0.10"