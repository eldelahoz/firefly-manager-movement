name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Lint commit messages
        env:
          FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$FROM" = "0000000000000000000000000000000000000000" ]; then
            FROM=$(git rev-list --max-parents=0 "$TO" | tail -1)
          fi
          pnpm exec commitlint --from "$FROM" --to "$TO" --verbose

  lint-pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Lint PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$TITLE" | pnpm exec commitlint --verbose

  guard-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Reject direct pushes to main
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Judge by the HEAD commit of the push, not every pushed commit: a
          # merge-commit push to main legitimately includes all branch commits
          # (which lack the (#NN) marker). A head commit produced by the merge
          # UI is either:
          #  - merge:  subject starts with "Merge pull request #NN from ..."
          #  - squash: subject ends with " (#NN)"
          # Anything else means the push was not the result of a merged PR.
          if [ -z "$HEAD_MSG" ]; then
            echo "No new commits (branch deletion or empty push) - nothing to judge."
            exit 0
          fi
          first_line="${HEAD_MSG%%$'\n'*}"
          case "$first_line" in
            "Merge pull request #"*)
              echo "OK: merge commit from PR UI."
              exit 0 ;;
          esac
          if printf '%s' "$first_line" | grep -Eq ' \(#[0-9]+\)$'; then
            echo "OK: squash commit from PR UI."
            exit 0
          fi
          echo "::error::Direct push to main detected: head commit '$first_line' is not a PR merge/squash result."
          echo "Fix: revert main to the last merged state and use the PR workflow (see CONTRIBUTING.md)."
          exit 1
